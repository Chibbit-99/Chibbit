<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBHS Secret Files...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f3f3f3;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .window {
            width: 800px;
            height: 500px;
            background-color: #ffffff;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .title-bar {
            height: 40px;
            background-color: #f6f6f6;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            padding: 0 16px;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .close { background-color: #ff5f56; }
        .minimize { background-color: #ffbd2e; }
        .maximize { background-color: #27c93f; }

        .title {
            margin-left: 20px;
            font-size: 13px;
            color: #555;
            font-weight: 500;
        }

        .toolbar {
            height: 50px;
            background-color: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
        }

        .nav-icons {
            display: flex;
            gap: 12px;
            color: #ccc;
        }

        .address-bar {
            flex-grow: 1;
            height: 28px;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 13px;
            color: #666;
            background-color: #f9f9f9;
        }

        .main-content {
            display: flex;
            flex-grow: 1;
        }

        .sidebar {
            width: 180px;
            background-color: #f6f6f6;
            border-right: 1px solid #e5e5e5;
            padding: 16px 8px;
            font-size: 13px;
            color: #444;
        }

        .sidebar-item {
            padding: 6px 8px;
            border-radius: 4px;
            margin-bottom: 4px;
            cursor: pointer;
        }

        .sidebar-item.active {
            background-color: #e0e0e0;
            font-weight: 500;
        }

        .file-grid {
            flex-grow: 1;
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            grid-auto-rows: max-content;
            gap: 24px;
            background-color: #ffffff;
        }

        .folder {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: #333;
            border: 1px solid transparent;
            padding: 8px;
            border-radius: 4px;
            transition: background 0.1s, border 0.1s;
        }

        .folder:hover {
            background-color: #e5f3ff;
            border: 1px solid #b8d6f3;
        }

        .folder-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 8px;
            position: relative;
        }

        /* SVG Folder Style */
        .folder-svg {
            fill: #ffe082;
            stroke: #ffa000;
            stroke-width: 2;
        }

        .folder-name {
            font-size: 12px;
            word-break: break-word;
            line-height: 1.3;
        }

        .status-bar {
            height: 25px;
            background-color: #f6f6f6;
            border-top: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 11px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="window">
        <!-- Title Bar -->
        <div class="title-bar">
            <div class="buttons">
                <div class="btn close"></div>

            </div>
            <div class="title">NBHS Secret Files...</div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">

            </div>
            <div class="address-bar">
                NBHS &gt; Intranet &gt; Secret Files

        </div>

        <!-- Main Workspace -->
        <div class="main-content">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-item active">Secret Files</div>
                <div class="sidebar-item">Coming soon...</div>
                <div class="sidebar-item">Coming soon...</div>
            </div>

            <!-- File Grid -->
            <div class="file-grid">

                <a href="https://schoolsnsw.sharepoint.com/sites/293YP4GC/Scope%20and%20Sequence%20for%20Parents/Forms/By%20KLA.aspx?id=%2Fsites%2F293YP4GC%2FScope%20and%20Sequence%20for%20Parents%2FAll%20documents&viewid=aa41c1ae%2D70eb%2D4c20%2D8dc7%2D1afb8cef0fc4&FolderCTID=0x0120008FB99EE5AF3F9646995EFEE38C3EDFD6" target="_blank" class="folder">
                    <div class="folder-icon">
                        <svg viewBox="0 0 24 24" class="folder-svg"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                    </div>
                    <div class="folder-name">Scope and Sequences Year 7-12</div>
                </a>

                <a href="https://schoolsnsw.sharepoint.com/sites/293YP4GC/Shared%20Documents/Forms/AllItems.aspx?id=%2Fsites%2F293YP4GC%2FShared%20Documents%2FAssessment%20Booklets&viewid=ccd78e23%2Df6c3%2D47cb%2D9775%2De005527b1330&FolderCTID=0x0120000E47EC7B4D9B214AB97B87B30C67D12D" target="_blank" class="folder">
                    <div class="folder-icon">
                        <svg viewBox="0 0 24 24" class="folder-svg"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                    </div>
                    <div class="folder-name">Assessment Schedule Year 7-12</div>
                </a>

                <a href="https://example.com" target="_blank" class="folder">
                    <div class="folder-icon">
                        <svg viewBox="0 0 24 24" class="folder-svg"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
                    </div>
                    <div class="folder-name">Coming soon...</div>
                </a>

            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            3 items - Files were sourced legally
        </div>
    </div>

</body>
</html>
